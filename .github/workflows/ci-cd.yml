name: Test, build and publish
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older run. A pull request is disposable, so its run is
# cancelled; a push to main is a publish and is allowed to finish, because cancelling it
# halfway can leave the registry holding one of a commit's two tags and not the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Static checks
        run: |
          python -m compileall -q seamcarve app.py
          ruff check seamcarve tests app.py
      - name: Unit tests
        run: python -m pytest

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize container path
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # Only the commit tag is pushed here. :latest is added at the end of the job, once the
      # image has been shown to start and serve the app, so a broken build never becomes what
      # an unqualified pull resolves to.
      - name: Build and publish the candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Building and pushing are not delivery. This pulls the image it has just published back
      # out of the registry and tests it twice over: the server has to answer Streamlit's health
      # endpoint, and the app script itself has to run without an exception — which is what
      # catches an import error, a missing dependency, or a missing asset that only fails inside
      # the image. The health endpoint alone would not: Streamlit executes the script when a
      # session connects, and nothing connects on its own.
      - name: Verify the published image serves the app
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.name }}:${{ github.sha }}"
          docker pull "$IMAGE"
          docker run --detach --name smoke --publish 8501:8501 "$IMAGE"
          cleanup() { docker rm --force smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          healthy=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8501/_stcore/health > /dev/null; then
              echo "the server answered /_stcore/health after ${attempt}s"
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::error::the published image did not answer /_stcore/health within 60s"
            docker logs smoke || true
            exit 1
          fi
          docker exec smoke python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('app.py', default_timeout=120).run()
          assert not at.exception, at.exception
          print('the app script ran without an exception')
          "
      # Reached only when the smoke test above passed, so :latest names an image that has been
      # started and exercised rather than merely built. The copy is made inside the registry
      # rather than by re-pushing from this runner: the build is an OCI index with a provenance
      # attestation, and a push from the daemon would publish only the bare platform manifest,
      # giving :latest a different digest from the commit tag.
      - name: Promote the verified image to latest
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.image.outputs.name }}:latest" \
            "${{ steps.image.outputs.name }}:${{ github.sha }}"
